[project]
name = "ahe"
version = "0.4.0"
description = "Companion code for Agent Harness Engineering"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "nbclient", "nbformat", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ahe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
