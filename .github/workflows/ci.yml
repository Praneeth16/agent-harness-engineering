name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Notebooks are generated from the package
        run: |
          python tools/build_notebooks.py
          git diff --exit-code -- 'chapter-*/*.ipynb'
      - name: Every notebook runs offline
        run: |
          python - <<'PY'
          import pathlib, nbformat
          from nbclient import NotebookClient
          for p in sorted(pathlib.Path(".").glob("chapter-*/*.ipynb")):
              nb = nbformat.read(p, as_version=4)
              NotebookClient(nb, timeout=120, kernel_name="python3",
                             resources={"metadata": {"path": str(p.parent)}}).execute()
              print("ran", p)
          PY
